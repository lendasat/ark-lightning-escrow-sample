[package]
name = "ark-escrow"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[dependencies]
ark-core = "0.8"
ark-grpc = { version = "0.8", default-features = false, features = ["tls-native-roots"] }
anyhow = "1"
bitcoin = { version = "0.32.7", features = ["base64", "rand", "serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
